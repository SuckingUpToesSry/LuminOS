<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12162a"/><stop offset=".45" stop-color="#1b1436"/><stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8bff"/><stop offset="1" stop-color="#b07bff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="220" fill="#3b2a6b" opacity=".35"/>
  <circle cx="840" cy="540" r="240" fill="#0d4d5c" opacity=".35"/>
  <!-- topbar -->
  <rect width="960" height="34" fill="#14171f" opacity=".8"/>
  <circle cx="24" cy="17" r="5.5" fill="url(#accent)"/>
  <text x="40" y="21" fill="#e9ebf2" font-family="system-ui,sans-serif" font-size="12" font-weight="600">LuminOS</text>
  <text x="770" y="21" fill="#a7adbd" font-family="system-ui,sans-serif" font-size="11">🌤 24°</text>
  <text x="905" y="21" fill="#e9ebf2" font-family="system-ui,sans-serif" font-size="11" font-weight="600">14:32</text>
  <!-- desktop icons -->
  <g font-family="system-ui,sans-serif" font-size="10" fill="#fff" text-anchor="middle">
    <g transform="translate(26,56)">
      <rect width="46" height="46" rx="11" fill="#3f7ae0"/><circle cx="23" cy="23" r="11" fill="none" stroke="#fff" stroke-width="1.6"/>
      <text y="62" fill="#e9ebf2">Navegador</text>
    </g>
    <g transform="translate(104,56)">
      <rect width="46" height="46" rx="11" fill="#f2b75a"/><rect x="12" y="11" width="22" height="24" rx="3" fill="#fff" opacity=".9"/>
      <text y="62" fill="#e9ebf2">Notas</text>
    </g>
    <g transform="translate(26,146)">
      <rect width="46" height="46" rx="11" fill="#8b6cff"/><circle cx="23" cy="23" r="8" fill="#fff" opacity=".9"/>
      <text y="62" fill="#e9ebf2">LuminAI</text>
    </g>
  </g>
  <!-- window 1 -->
  <g filter="url(#shadow)">
    <rect x="180" y="82" width="612" height="376" rx="14" fill="#0f1219" opacity=".93" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="180" y="82" width="612" height="38" rx="14" fill="url(#glass)"/>
    <circle cx="200" cy="101" r="5" fill="#ff5f57"/><circle cx="216" cy="101" r="5" fill="#febc2e"/><circle cx="232" cy="101" r="5" fill="#28c840"/>
    <text x="256" y="105" fill="#a7adbd" font-family="system-ui,sans-serif" font-size="11">Navegador — Nova aba</text>
    <rect x="192" y="132" width="588" height="30" rx="15" fill="#191d26" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="212" y="151" fill="#6f7686" font-family="system-ui,sans-serif" font-size="11">Pesquisar ou digitar um endereço</text>
    <!-- tiles -->
    <g font-family="system-ui,sans-serif" font-size="9.5" fill="#a7adbd" text-anchor="middle">
      <g transform="translate(220,215)"><rect width="34" height="34" rx="9" fill="#5a6b8c"/><text x="17" y="22" fill="#fff" font-size="13">W</text><text y="50">Wikipedia</text></g>
      <g transform="translate(310,215)"><rect width="34" height="34" rx="9" fill="#ff4b4b"/><text x="17" y="22" fill="#fff" font-size="13">▶</text><text y="50">YouTube</text></g>
      <g transform="translate(400,215)"><rect width="34" height="34" rx="9" fill="#24292e"/><text x="17" y="22" fill="#fff" font-size="13">G</text><text y="50">GitHub</text></g>
      <g transform="translate(490,215)"><rect width="34" height="34" rx="9" fill="#ff6a3d"/><text x="17" y="22" fill="#fff" font-size="13">r</text><text y="50">Reddit</text></g>
      <g transform="translate(580,215)"><rect width="34" height="34" rx="9" fill="#7d4bd8"/><text x="17" y="22" fill="#fff" font-size="13">T</text><text y="50">Twitch</text></g>
      <g transform="translate(670,215)"><rect width="34" height="34" rx="9" fill="#4285f4"/><text x="17" y="22" fill="#fff" font-size="13">G</text><text y="50">Google</text></g>
    </g>
    <text x="486" y="330" text-anchor="middle" fill="#e9ebf2" font-family="system-ui,sans-serif" font-size="17" font-weight="300">Lumin<tspan font-weight="700">Browser</tspan></text>
    <text x="486" y="352" text-anchor="middle" fill="#6f7686" font-family="system-ui,sans-serif" font-size="10.5">abas · favoritos · histórico · modo proxy</text>
  </g>
  <!-- window 2 (AI) -->
  <g filter="url(#shadow)">
    <rect x="486" y="300" width="392" height="248" rx="14" fill="#12151d" opacity=".96" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="486" y="300" width="392" height="34" rx="14" fill="url(#glass)"/>
    <circle cx="504" cy="317" r="4.5" fill="#ff5f57"/><circle cx="518" cy="317" r="4.5" fill="#febc2e"/><circle cx="532" cy="317" r="4.5" fill="#28c840"/>
    <text x="552" y="321" fill="#a7adbd" font-family="system-ui,sans-serif" font-size="10.5">LuminAI</text>
    <circle cx="584" cy="404" r="18" fill="url(#accent)"/>
    <text x="584" y="436" text-anchor="middle" fill="#e9ebf2" font-family="system-ui,sans-serif" font-size="12">Como posso ajudar?</text>
    <g font-family="system-ui,sans-serif" font-size="9" fill="#a7adbd">
      <rect x="516" y="448" width="128" height="20" rx="10" fill="#191d26" stroke="#ffffff" stroke-opacity=".08"/><text x="526" y="461">Escreva um e-mail…</text>
      <rect x="652" y="448" width="118" height="20" rx="10" fill="#191d26" stroke="#ffffff" stroke-opacity=".08"/><text x="662" y="461">Resuma um texto</text>
      <rect x="510" y="486" width="344" height="34" rx="12" fill="#191d26" stroke="#ffffff" stroke-opacity=".1"/><text x="524" y="507">Pergunte alguma coisa…</text>
      <circle cx="834" cy="503" r="11" fill="url(#accent)"/>
    </g>
  </g>
  <!-- dock -->
  <g filter="url(#shadow)">
    <rect x="272" y="536" width="416" height="52" rx="17" fill="#14171f" opacity=".88" stroke="#ffffff" stroke-opacity=".12"/>
    <g transform="translate(286,542)">
      <rect width="40" height="40" rx="11" fill="#3f7ae0"/><rect x="11" y="11" width="18" height="18" rx="9" fill="none" stroke="#fff" stroke-width="1.6"/>
      <rect x="52" width="40" height="40" rx="11" fill="#f2b75a"/>
      <rect x="104" width="40" height="40" rx="11" fill="#8b6cff"/>
      <rect x="156" width="40" height="40" rx="11" fill="#4ade80"/>
      <rect x="208" width="40" height="40" rx="11" fill="#f0709a"/>
      <rect x="260" width="40" height="40" rx="11" fill="#31c9a3"/>
      <rect x="312" width="40" height="40" rx="11" fill="#5eb0ff"/>
      <rect x="364" width="40" height="40" rx="11" fill="#8b93a7"/>
    </g>
    <circle cx="306" cy="588" r="2" fill="#a7adbd"/><circle cx="358" cy="588" r="2" fill="#a7adbd"/>
  </g>
</svg>
