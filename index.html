<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<meta name="description" content="LuminOS — um sistema operacional na web: navegador, notas, IA, jogos, música, terminal e mais. Minimalista, rápido e interativo." />
<title>LuminOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238b9dff'/%3E%3Cstop offset='1' stop-color='%23c58bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white' fill-opacity='.92'/%3E%3C/svg%3E" />
<link rel="manifest" href="assets/manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/apps.css" />
</head>
<body>

<!-- ─────────────────  BOOT  ───────────────── -->
<div id="boot" class="boot">
  <div class="boot-logo">
    <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
      <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="var(--accent)"/><stop offset="1" stop-color="#c58bff"/>
      </linearGradient></defs>
      <circle cx="24" cy="24" r="21" fill="none" stroke="url(#bg1)" stroke-width="2.5" stroke-dasharray="100 32" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="7" fill="url(#bg1)"/>
    </svg>
  </div>
  <div class="boot-name">Lumin<span>OS</span></div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-msg" id="boot-msg">Iniciando o sistema…</div>
</div>

<!-- ─────────────────  DESKTOP  ───────────────── -->
<div id="desktop" class="desktop" hidden>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="wallpaper-shade" id="wallpaper-shade"></div>
  <div class="desk-search" id="desk-search" hidden>
    <div class="ds-inner">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="ds-input" type="text" placeholder="Pesquisar apps, arquivos e a web…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="ds-results" id="ds-results"></div>
  </div>
  <div class="icon-layer" id="icons"></div>
  <div class="window-layer" id="windows"></div>
  <div class="snap-preview" id="snap-preview" hidden></div>
</div>

<!-- ─────────────────  TOP BAR  ───────────────── -->
<header id="topbar" class="topbar" hidden>
  <div class="tb-left">
    <button class="tb-menu" id="btn-launcher" title="Apps (Ctrl/Cmd + K)">
      <span class="logo-dot"></span> <b>LuminOS</b>
    </button>
    <div class="tb-appmenu" id="tb-appmenu"></div>
  </div>
  <div class="tb-right">
    <button class="tb-chip" id="btn-weather" title="Clima (demonstração)">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span id="weather-txt">—</span>
    </button>
    <div class="tb-tray" id="tray">
      <button class="tray-btn" id="btn-vol" title="Volume"></button>
      <button class="tray-btn" id="btn-batt" title="Bateria"></button>
    </div>
    <button class="tb-clock" id="btn-clock" title="Notificações e calendário">
      <span id="tb-clock-time">--:--</span>
      <span id="tb-clock-date">—</span>
    </button>
  </div>
</header>

<!-- ─────────────────  DOCK  ───────────────── -->
<div id="dock" class="dock" hidden></div>

<!-- ─────────────────  PANELS  ───────────────── -->
<div id="launcher" class="panel launcher" hidden></div>
<div id="quickpanel" class="panel quick" hidden></div>
<div id="notifpanel" class="panel notif" hidden></div>

<div id="palette" class="overlay palette" hidden>
  <div class="pal-box">
    <div class="pal-input">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pal-q" type="text" placeholder="Ir para… (apps, ações, configurações)" autocomplete="off" spellcheck="false" />
    </div>
    <div class="pal-list" id="pal-list"></div>
    <div class="pal-foot"><kbd>↑</kbd><kbd>↓</kbd> navegar <kbd>↵</kbd> abrir <kbd>esc</kbd> fechar</div>
  </div>
</div>

<div id="switcher" class="overlay switcher" hidden>
  <div class="sw-list" id="sw-list"></div>
</div>

<div id="lockscreen" class="lockscreen" hidden>
  <div class="lock-bg" id="lock-bg"></div>
  <div class="lock-center">
    <div class="lock-time" id="lock-time">--:--</div>
    <div class="lock-date" id="lock-date">—</div>
    <div class="lock-user" id="lock-user"></div>
    <form class="lock-form" id="lock-form">
      <input id="lock-pin" type="password" inputmode="numeric" placeholder="PIN (ou Enter)" autocomplete="off" />
      <button class="btn primary" type="submit">Desbloquear</button>
    </form>
    <button class="lock-switch" id="lock-switch">Trocar de usuário</button>
  </div>
</div>

<div id="setup" class="setup" hidden>
  <form class="setup-card" id="setup-form">
    <div class="setup-head">
      <div class="setup-logo">
        <svg viewBox="0 0 48 48" width="40" height="40"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="100 32" stroke-linecap="round"/><circle cx="24" cy="24" r="7" fill="var(--accent)"/></svg>
      </div>
      <div>
        <h1>Bem-vindo ao LuminOS</h1>
        <p>Vamos preparar tudo em 10 segundos.</p>
      </div>
    </div>

    <label class="field">
      <span>Como podemos te chamar?</span>
      <input id="setup-name" type="text" placeholder="Seu nome" maxlength="24" autocomplete="off" required />
    </label>

    <div class="field">
      <span>Escolha um tema</span>
      <div class="theme-picks" id="setup-theme"></div>
    </div>

    <div class="field">
      <span>Cor de destaque</span>
      <div class="accent-picks" id="setup-accent"></div>
    </div>

    <div class="setup-actions">
      <button type="button" class="btn ghost" id="setup-guest">Entrar como visitante</button>
      <button type="submit" class="btn primary">Começar <span aria-hidden="true">→</span></button>
    </div>
    <p class="setup-note">Tudo é salvo localmente no seu navegador. Nada é enviado a servidores.</p>
  </form>
</div>

<div id="ctxmenu" class="ctxmenu" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<div id="shutdown" class="shutdown" hidden>
  <div class="sd-inner">
    <div class="sd-ring"></div>
    <p>Desligando…</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
